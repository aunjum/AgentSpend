[package]
name = "agentspend"
version = "0.1.0"
edition = "2021"
description = "Local-first AI coding-agent usage tracker"
license = "MIT"

[[bin]]
name = "agentspend"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

